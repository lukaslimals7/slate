<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Slate — notes &amp; sketches</title>
<meta name="description" content="Notes and sketches in one quiet place. Works offline, lives on your device, nothing is uploaded.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5f1">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Slate">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1a17'/%3E%3Cpath d='M9 21c2-6 5-9 8-9s5 3 6 9' stroke='%23e8a33d' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: "Lora", "Iowan Old Style", Georgia, serif;
    --bg:#f7f5f1; --panel:#fffdfa; --paper:#fffefb;
    --ink:#1b1a17; --muted:#8c867c; --faint:#b3ada2;
    --line:#e7e2d8; --hover:#f1ede4; --active:#ece4d7;
    --accent:#b3572f; --accent-soft:#f4e7de;
    --shadow: 0 1px 2px rgba(27,26,23,.04), 0 8px 24px rgba(27,26,23,.06);
    --side: 268px; --top: 62px; --status: 34px;
  }
  html[data-theme="dark"]{
    --bg:#141310; --panel:#1b1915; --paper:#191712;
    --ink:#ece7dc; --muted:#9a9386; --faint:#6f6a60;
    --line:#2b2720; --hover:#221f19; --active:#2a261e;
    --accent:#e0855a; --accent-soft:#33241b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%; overscroll-behavior:none}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--ui); font-size:14px;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    transition:background .25s ease, color .25s ease;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
  input,textarea{font:inherit;color:inherit}
  ::selection{background:var(--accent-soft); color:var(--ink)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

  /* --app-h is set by script when the on-screen keyboard covers the page */
  .app{display:grid; grid-template-columns:var(--side) 1fr; height:100vh; height:100dvh; height:var(--app-h, 100dvh); overflow:hidden}

  /* ---------- sidebar ---------- */
  .sidebar{
    background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; z-index:20;
  }
  .side-head{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px}
  .brand{display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:-.01em; font-size:15px}
  .mark{width:18px;height:18px;border-radius:5px;background:var(--ink);position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;inset:4px 4px 5px;border:1.6px solid var(--bg);border-radius:2px 2px 6px 6px;border-top-color:transparent}
  .search{position:relative;margin:0 14px 10px}
  .search input{
    width:100%; padding:9px 34px 9px 11px; border-radius:9px;
    background:var(--bg); border:1px solid transparent; color:var(--ink);
    font-size:13px; transition:border-color .15s, background .15s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none; border-color:var(--line); background:var(--paper)}
  .search kbd{position:absolute; right:9px; top:50%; transform:translateY(-50%); pointer-events:none}
  kbd{font-family:var(--ui); font-size:10px; color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:1px 4px; background:var(--panel)}
  .new-btn{
    margin:0 14px 12px; padding:9px 12px; border-radius:9px;
    background:var(--ink); color:var(--bg); font-weight:500; font-size:13px;
    display:flex; align-items:center; gap:8px; justify-content:flex-start;
    transition:transform .08s ease, opacity .15s;
  }
  .new-btn span{font-size:16px; line-height:1; font-weight:400}
  .new-btn kbd{margin-left:auto; border-color:rgba(255,255,255,.18); color:inherit; opacity:.55; background:transparent}
  .new-btn:hover{opacity:.9}
  .new-btn:active{transform:scale(.99)}
  .notes{flex:1; overflow-y:auto; padding:2px 8px 8px; min-height:0}
  .note-item{
    display:block; width:100%; text-align:left; padding:10px 10px 9px; border-radius:8px;
    margin-bottom:2px; position:relative; transition:background .12s;
  }
  .note-item:hover{background:var(--hover)}
  .note-item.active{background:var(--active)}
  .note-item.active::before{content:""; position:absolute; left:0; top:11px; bottom:11px; width:2px; border-radius:2px; background:var(--accent)}
  .note-item .t{font-size:13px; font-weight:500; letter-spacing:-.005em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px}
  .note-item .s{font-size:12px; color:var(--muted); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:1px}
  .note-item .d{font-size:10.5px; color:var(--faint); margin-top:4px; letter-spacing:.02em}
  .empty-list{padding:26px 16px; color:var(--faint); font-size:12.5px; line-height:1.6; text-align:center}
  .side-foot{display:flex; gap:6px; padding:10px 12px; border-top:1px solid var(--line)}
  .ghost{flex:1; padding:7px 8px; border-radius:7px; font-size:12px; color:var(--muted); border:1px solid transparent; transition:.12s}
  .ghost:hover{background:var(--hover); color:var(--ink)}
  /* install card — only shown when the browser says it can be installed */
  .install-btn{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:11px 14px; border-top:1px solid var(--line); background:var(--accent-soft); color:var(--ink); font-size:13px; font-weight:500; transition:filter .12s}
  .install-btn small{color:var(--muted); font-weight:400; margin-left:auto; font-size:11px; letter-spacing:.01em}
  .install-btn:hover{filter:brightness(.97)}
  .install-ico{display:grid; place-items:center; width:20px; height:20px; border-radius:6px; background:var(--ink); color:var(--bg); font-size:12px; flex:0 0 auto}
  .install-btn[hidden], .install-hint[hidden], .net[hidden]{display:none}
  .install-hint{display:grid; gap:3px; padding:12px 14px; border-top:1px solid var(--line); font-size:11.5px; line-height:1.5; color:var(--muted)}
  .install-hint strong{color:var(--ink); font-size:12px; font-weight:600}
  .install-hint em{font-style:normal; color:var(--ink)}

  /* ---------- main ---------- */
  .main{
    display:grid; grid-template-columns:minmax(0, 1fr); grid-template-rows:var(--top) 1fr var(--status);
    min-width:0; min-height:0;
    /* notch and home-indicator: zero everywhere except a cut-out phone */
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }
  .topbar{display:flex; align-items:center; gap:10px; padding:0 14px 0 22px; border-bottom:1px solid var(--line); background:var(--panel)}
  .title{flex:1; min-width:0; border:0; background:transparent; outline:none; font-family:var(--serif); font-size:18px; font-weight:500; letter-spacing:-.01em; padding:6px 0}
  .title::placeholder{color:var(--faint)}
  .top-actions{display:flex; align-items:center; gap:6px}
  .icon-btn{width:32px; height:32px; display:grid; place-items:center; border-radius:8px; color:var(--muted); font-size:15px; line-height:1; transition:.12s}
  .icon-btn:hover{background:var(--hover); color:var(--ink)}
  .icon-btn.danger:hover{background:#f6e3dd; color:#a83a2a}
  html[data-theme="dark"] .icon-btn.danger:hover{background:#3a201a; color:#e58978}
  .icon-btn[aria-pressed="true"]{background:var(--active); color:var(--ink)}
  .seg{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:2px; gap:1px}
  .seg button{padding:4px 10px; border-radius:6px; font-size:12px; color:var(--muted); transition:.12s; white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .workspace{display:grid; grid-template-columns:1fr 1fr; min-height:0; min-width:0}
  .pane{min-width:0; min-height:0; position:relative; display:flex; flex-direction:column}
  .editor-pane{background:var(--panel); border-right:1px solid var(--line)}
  #body{
    flex:1; width:100%; border:0; outline:none; background:transparent; overflow-y:auto;
    font-family:var(--serif); font-size:16.5px; line-height:1.72; letter-spacing:.002em;
    padding:30px 34px 60px; color:var(--ink); min-height:0;
    white-space:pre-wrap; overflow-wrap:break-word; word-break:break-word; caret-color:var(--ink);
  }
  .editor-wrap{flex:1; min-height:0; position:relative; display:flex; flex-direction:column}
  .editor-tools{gap:3px; padding:5px 10px}
  .fmt-btn{height:26px; min-width:26px; padding:0 7px; border-radius:6px; font-size:11.5px; color:var(--muted); display:inline-flex; align-items:center; justify-content:center; transition:.12s; letter-spacing:.01em}
  .fmt-btn:hover{background:var(--hover); color:var(--ink)}
  .fmt-btn.on{background:var(--active); color:var(--ink)}
  #body .ln{min-height:1.72em; position:relative}
  #body .ln[data-t="h1"]{font-size:26px; line-height:1.35; font-weight:500; letter-spacing:-.012em; margin:16px 0 2px; min-height:1.35em}
  #body .ln[data-t="h2"]{font-size:21px; line-height:1.4; font-weight:500; letter-spacing:-.006em; margin:13px 0 1px; min-height:1.4em}
  #body .ln[data-t="h3"]{font-size:18px; line-height:1.45; font-weight:500; margin:10px 0 0; min-height:1.45em}
  #body .ln[data-t="ul"], #body .ln[data-t="ol"]{padding-left:24px}
  #body .ln[data-t="ul"]::before{content:"•"; position:absolute; left:7px; color:var(--accent); opacity:.8}
  #body .ln[data-t="ol"]::before{content:attr(data-n) "."; position:absolute; left:0; width:19px; text-align:right; color:var(--muted); font-size:.88em; font-variant-numeric:tabular-nums}
  #body .ln[data-t="code"]{
    font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size:13.5px; line-height:1.62; letter-spacing:0; color:var(--ink);
    background:var(--bg); padding:0 13px; min-height:1.62em;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
  #body .ln[data-t="code"].code-first{padding-top:9px; border-top:1px solid var(--line); border-radius:9px 9px 0 0; margin-top:8px}
  #body .ln[data-t="code"].code-last{padding-bottom:9px; border-bottom:1px solid var(--line); border-radius:0 0 9px 9px; margin-bottom:10px}
  #body .ln[data-t="code"].code-first.code-last{border-radius:9px}
  #body a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-soft); cursor:pointer}
  #body a:hover{border-bottom-color:var(--accent)}
  .code-copy{position:absolute; z-index:3; font-size:11px; color:var(--muted); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:3px 8px; opacity:0; pointer-events:none; transition:opacity .12s; box-shadow:var(--shadow)}
  .code-copy.on{opacity:1; pointer-events:auto}
  #body .note-img{display:inline-block; vertical-align:bottom; max-width:100%; max-height:62vh; margin:6px 2px; border-radius:8px; border:1px solid var(--line); background:var(--bg); cursor:zoom-in}
  #body .note-img:focus, #body .note-img.selected{outline:2px solid var(--accent); outline-offset:2px}
  .empty-hint{position:absolute; top:30px; left:34px; font-family:var(--serif); font-size:16.5px; line-height:1.72; color:var(--faint); pointer-events:none}
  .empty-hint[hidden]{display:none}
  .app[data-mode="write"] .empty-hint{top:38px; left:15%}

  .canvas-pane{background:var(--paper)}
  .canvas-wrap{flex:1; position:relative; min-height:0}
  #canvas{
    position:absolute; inset:0; width:100%; height:100%; touch-action:none;
    cursor:crosshair; display:block;
    background-image:radial-gradient(var(--line) 1px, transparent 1px);
    background-size:24px 24px; background-position:-1px -1px;
  }
  /* the canvas takes focus on click so ⌘V can target it — never draw a ring for that */
  #canvas:focus, #canvas:focus-visible{outline:none}
  .tools{display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap}
  /* grouped so a phone can lay the toolbar out in two tidy rows */
  .tgroup{display:flex; align-items:center; gap:8px; min-width:0}
  .swatches{display:flex; gap:5px; align-items:center}
  .sw{width:17px; height:17px; border-radius:50%; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); transition:transform .1s}
  .sw:hover{transform:scale(1.12)}
  .sw.on{border-color:var(--panel); box-shadow:0 0 0 2px var(--ink)}
  .tools input[type=range]{width:74px; accent-color:var(--ink); height:18px}
  .divider{width:1px; height:18px; background:var(--line); margin:0 2px}
  .canvas-hint{position:absolute; inset:auto 0 18px; text-align:center; color:var(--faint); font-size:12px; pointer-events:none; transition:opacity .4s}

  /* ---------- pasted images ---------- */
  .paste-chip{position:absolute; top:10px; left:10px; display:none; align-items:center; gap:6px; padding:4px 7px 4px 4px; border-radius:9px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); font-size:11.5px; color:var(--muted); z-index:4; max-width:calc(100% - 20px)}
  .paste-chip.on{display:flex}
  .paste-chip img{width:26px; height:26px; border-radius:6px; object-fit:cover; display:block; cursor:zoom-in; flex:0 0 auto}
  .paste-chip .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
  .paste-chip button{width:22px; height:22px; display:grid; place-items:center; border-radius:6px; color:var(--muted); font-size:12px; line-height:1; flex:0 0 auto}
  .paste-chip button:hover{background:var(--hover); color:var(--ink)}
  .lightbox{position:fixed; inset:0; display:none; place-items:center; padding:5vh 5vw; background:rgba(20,19,16,.84); z-index:80}
  .lightbox.show{display:grid}
  .lightbox img{max-width:100%; max-height:90vh; border-radius:10px; box-shadow:0 24px 70px rgba(0,0,0,.5); background:var(--paper)}

  .status{display:flex; align-items:center; gap:8px; padding:0 16px; border-top:1px solid var(--line); background:var(--panel); font-size:11.5px; color:var(--muted); letter-spacing:.01em}
  .status .grow{flex:1}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
  .saved-flash{color:var(--accent)}
  .keys{color:var(--faint)}
  .net{color:var(--accent); font-size:11px; white-space:nowrap}
  /* keyboard open: the status bar would only steal room from the page */
  html.kb-open{--status:0px}
  html.kb-open .status{display:none}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 14px);
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:9px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:.22s ease;
    box-shadow:var(--shadow); z-index:60; max-width:80vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  .only-mobile{display:none}
  .backdrop{position:fixed; inset:0; background:rgba(20,19,16,.42); opacity:0; pointer-events:none; transition:opacity .2s; z-index:15; backdrop-filter:blur(2px)}
  .backdrop.show{opacity:1; pointer-events:auto}

  .app[data-mode="write"] .canvas-pane{display:none}
  .app[data-mode="write"] .workspace{grid-template-columns:1fr}
  .app[data-mode="write"] #body{padding:38px 15%}
  .app[data-mode="draw"] .editor-pane{display:none}
  .app[data-mode="draw"] .workspace{grid-template-columns:1fr}

  @media (max-width: 940px){
    :root{ --top:56px; --status:32px; }
    .app{grid-template-columns:1fr}
    .sidebar{
      position:fixed; inset:0 auto 0 0; width:min(86vw, 320px);
      transform:translateX(-102%); transition:transform .22s ease; box-shadow:var(--shadow);
      padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);
    }
    .sidebar.open{transform:none}
    .notes{overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
    .only-mobile{display:grid}
    .topbar{padding:0 6px 0 4px; gap:2px}
    .title{font-size:16.5px; padding:4px 0}
    .top-actions{gap:2px}
    .icon-btn{width:38px; height:38px; font-size:16px}
    .keys{display:none}
    /* ⌘ hints mean nothing to a thumb */
    .search kbd, .new-btn kbd{display:none}
    .search input{padding-right:11px}
    /* one toggle instead of three view buttons: phones only ever need write or draw */
    .seg{display:none}
    .app[data-mode="split"] .workspace{grid-template-columns:1fr}
    .app[data-mode="split"] .canvas-pane{display:none}
    .app[data-mode="split"] .editor-pane{border-right:0}
    .editor-tools{padding:3px 6px; gap:2px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
    .editor-tools::-webkit-scrollbar{display:none}
    .editor-tools .fmt-btn{height:34px; min-width:34px; padding:0 9px; font-size:12px; flex:0 0 auto}
    #body{
      padding:20px 18px 110px; font-size:17px; line-height:1.68;
      -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
    }
    .app[data-mode="write"] #body{padding:20px 18px 110px}
    .empty-hint{top:22px; left:18px; font-size:17px}
    .app[data-mode="write"] .empty-hint{top:22px; left:18px}
    #body .note-img{max-height:46vh}
    /* draw toolbar: ink on one row, actions on the next — nothing falls off the edge.
       Scoped to #tools: the editor's formatting row is a .tools too. */
    #tools{
      display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"ink ink" "mode hist";
      gap:2px 6px; padding:5px 8px 4px; flex-wrap:nowrap;
    }
    .tgroup-ink{grid-area:ink}
    .tgroup-mode{grid-area:mode}
    .tgroup-hist{grid-area:hist; justify-content:flex-end}
    #tools .divider{display:none}
    #tools .icon-btn{width:40px; height:40px; font-size:17px}
    .swatches{gap:9px; flex:1; min-width:0}
    .sw{width:25px; height:25px; flex:0 0 auto}
    .sw.on{box-shadow:0 0 0 2px var(--ink)}
    #tools input[type=range]{flex:1; width:auto; min-width:52px; height:34px; margin:0}
    .canvas-hint{font-size:11.5px; bottom:8px; padding:0 10px}
    .paste-chip{top:6px; left:6px}
    .status{padding:0 12px; font-size:11px}
    .note-item{padding:12px 10px 11px}
    .side-foot{padding:8px 10px; gap:8px}
    .ghost{padding:11px 8px; font-size:12.5px}
    .search{margin:0 12px 8px}
    /* 16px inputs stop iOS from zooming the page in when one is focused */
    .search input{font-size:16px}
    .toast{bottom:calc(16px + env(safe-area-inset-bottom)); font-size:13px; max-width:calc(100vw - 32px)}
    .lightbox{padding:2vh 3vw}
    .lightbox img{max-height:88vh}
  }
  /* fingers are bigger than cursors */
  @media (pointer: coarse){
    .note-item:hover{background:none}
    .note-item.active:hover{background:var(--active)}
    .code-copy{font-size:12px; padding:5px 10px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app" id="app" data-mode="split">

  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand"><span class="mark"></span> Slate</div>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Search notes…" autocomplete="off" spellcheck="false">
      <kbd>⌘K</kbd>
    </div>
    <button class="new-btn" id="newBtn"><span>+</span> New note <kbd>⌘N</kbd></button>
    <nav class="notes" id="notes" aria-label="Notes"></nav>
    <div class="side-foot">
      <button class="ghost" id="importBtn">Import</button>
      <button class="ghost" id="exportAllBtn">Export all</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
    <button class="install-btn" id="installBtn" hidden>
      <span class="install-ico">⤓</span>
      <span>Install Slate</span>
      <small>opens as its own app</small>
    </button>
    <div class="install-hint" id="installHint" hidden>
      <strong>Add to your home screen</strong>

  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Notes">☰</button>

      <div class="top-actions">
        <button class="icon-btn only-mobile" id="modeToggle" title="Draw" aria-label="Draw">✎</button>

      </div>

    <section class="workspace">
      <div class="pane editor-pane">

          <button class="fmt-btn" data-fmt="h1" title="Heading 1">H1</button>
          <button class="fmt-btn" data-fmt="h2" title="Heading 2">H2</button>

          <button class="fmt-btn" data-fmt="ol" title="Numbered list">1.</button>

        </div>

          <div id="body" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Note"></div>
          <div class="empty-hint" id="emptyHint">Start writing…</div>
          <button class="code-copy" id="codeCopy" type="button" title="Copy this code">Copy</button>
        </div>
      </div>
      <div class="pane canvas-pane">
        <div class="tools" id="tools">
          <div class="tgroup tgroup-ink">
            <div class="swatches" id="swatches"></div>
            <input type="range" id="size" min="0.8" max="16" step="0.2" value="2.4" title="Brush size">
          </div>
          <div class="tgroup tgroup-mode">
            <span class="divider"></span>
            <button class="icon-btn" id="penBtn" aria-pressed="true" title="Pen">✎</button>
            <button class="icon-btn" id="eraserBtn" aria-pressed="false" title="Eraser">⌫</button>
          </div>
          <div class="tgroup tgroup-hist">
            <span class="divider"></span>
            <button class="icon-btn" id="undoBtn" title="Undo">↶</button>
            <button class="icon-btn" id="redoBtn" title="Redo">↷</button>
            <button class="icon-btn" id="pngBtn" title="Save drawing as PNG">⤓</button>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="canvas" tabindex="0"></canvas>
          <div class="canvas-hint" id="hint">Draw with a mouse, finger, or pen · ⌘V pastes an image</div>

            <img id="chipThumb" alt="Pasted image">
            <span class="nm" id="chipLabel">Pasted image</span>

      <span id="counts">0 words</span>
      <span class="dot"></span>
      <span id="saved">Saved</span>
      <span class="grow"></span>
      <span id="net" class="net" hidden>Offline</span>
      <span class="keys">⌘N new · ⌘K search · ⌘S save · ⌘1-3 heading · ⌘` code · ⌘⇧8 bullets</span>
    </footer>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview"><img id="lightboxImg" alt=""></div>
<script>
(() => {
"use strict";

const LS_NOTES = "slate.notes.v1", LS_THEME = "slate.theme", LS_MODE = "slate.mode";
const $ = (id) => document.getElementById(id);
const app = $("app"), sidebar = $("sidebar"), backdrop = $("backdrop");
const notesEl = $("notes"), searchEl = $("search"), titleEl = $("title"), bodyEl = $("body");
const countsEl = $("counts"), savedEl = $("saved"), toastEl = $("toast");
const cv = $("canvas"), ctx = cv.getContext("2d", { desynchronized: true });
const hintEl = $("hint");
const pasteChip = $("pasteChip"), emptyHint = $("emptyHint");
const lightbox = $("lightbox"), lightboxImg = $("lightboxImg");

const COLORS = ["#1b1a17", "#b3572f", "#2f6b57", "#2b5d8a", "#8a5a2b", "#d8b26a"];
let color = COLORS[0], brush = 2.4, erasing = false;

let notes = [], activeId = null;
let undoStack = [], redoStack = [];
let saveTimer = null, listTimer = null, dirty = false;
let drawing = false, stroke = null, W = 0, H = 0, dpr = 1;

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => Date.now();
const blankNote = (extra = {}) => Object.assign({ id: uid(), title: "", body: "", strokes: [], images: [], pasted: [], created: now(), updated: now() }, extra);

function load() {
  try {
    const raw = localStorage.getItem(LS_NOTES);
    if (raw) {
      const parsed = JSON.parse(raw);
      notes = Array.isArray(parsed) ? parsed : (parsed.notes || []);
    }
  } catch (e) { notes = []; }
  notes = notes.filter(n => n && typeof n === "object").map(n => ({
    id: n.id || uid(),
    title: typeof n.title === "string" ? n.title : "",
    body: typeof n.body === "string" ? n.body : "",
    strokes: Array.isArray(n.strokes) ? n.strokes : [],
    images: cleanImages(n.images),
    pasted: cleanPasted(n.pasted),
    created: n.created || now(),
    updated: n.updated || now()
  }));
  if (!notes.length) {
    notes = [blankNote({
      title: "Welcome to Slate",
      body: "A quiet place for notes and sketches.\n\nEverything stays on this device — no account, no server, no sync. Your notes live in this browser's local storage.\n\nDraw in the pane on the right. Switch to Draw for a full canvas when you need the room, or Write when it's just words.\n\n⌘N new note · ⌘K search · ⌘S save now\nShare ↗ copies a link that carries the whole note."
    })];
  }
  notes.sort((a, b) => b.updated - a.updated);
  activeId = notes[0].id;
}

/* images whose token was deleted from the text stop paying rent */
function pruneImages() {
  const re = /!\[image\]\(slateimg:([a-z0-9]+)\)/gi;
  for (const n of notes) {
    if (!n.images || !n.images.length) continue;
    const keep = new Set();
    let m;
    re.lastIndex = 0;
    while ((m = re.exec(String(n.body || "")))) keep.add(m[1]);
    if (n.images.every(i => keep.has(i.id))) continue;
    for (const im of n.images) if (!keep.has(im.id)) imgPool.set(im.id, im.src);
    n.images = n.images.filter(i => keep.has(i.id));
  }
}

function persist() {
  try {
    pruneImages();
    localStorage.setItem(LS_NOTES, JSON.stringify(notes));
    dirty = false;
    savedEl.textContent = "Saved";
    savedEl.classList.add("saved-flash");
    setTimeout(() => savedEl.classList.remove("saved-flash"), 700);
  } catch (e) {
    savedEl.textContent = "Storage full — export to keep your work";
    toast("Couldn't save: browser storage is full.");
  }
}
function scheduleSave() {
  dirty = true;
  savedEl.textContent = "Saving…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 450);
}
function saveNow() { clearTimeout(saveTimer); if (dirty) persist(); }
const activeNote = () => notes.find(n => n.id === activeId) || null;
const touch = (n) => { n.updated = now(); };

/* ---------- sidebar ---------- */
function relTime(ts) {
  const s = Math.floor((now() - ts) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 172800) return "yesterday";
  return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function snippet(n) {
  const text = plainBody(n.body || "");
  if (text) return text;
  if (n.strokes && n.strokes.length) return "Sketch";
  return (n.images && n.images.length) ? "Image attachment" : "Empty note";
}
function renderList() {
  const q = searchEl.value.trim().toLowerCase();
  const list = notes
    .filter(n => !q || (n.title + " " + n.body).toLowerCase().includes(q))
    .sort((a, b) => b.updated - a.updated);

  notesEl.innerHTML = "";
  if (!list.length) {
    const d = document.createElement("div");
    d.className = "empty-list";
    d.textContent = q ? "Nothing matches that." : "No notes yet.";
    notesEl.appendChild(d);
    return;
  }
  const frag = document.createDocumentFragment();
  for (const n of list) {
    const b = document.createElement("button");
    b.className = "note-item" + (n.id === activeId ? " active" : "");
    b.dataset.id = n.id;
    const t = document.createElement("div"); t.className = "t"; t.textContent = n.title.trim() || "Untitled";
    const s = document.createElement("div"); s.className = "s"; s.textContent = snippet(n);
    const d = document.createElement("div"); d.className = "d"; d.textContent = relTime(n.updated);
    b.append(t, s, d);
    b.addEventListener("click", () => selectNote(n.id));
    frag.appendChild(b);
  }
  notesEl.appendChild(frag);
}
function scheduleList() { clearTimeout(listTimer); listTimer = setTimeout(renderList, 250); }

/* ---------- editor ---------- */
function selectNote(id, opts = {}) {
  if (id === activeId && !opts.force) { closeDrawer(); return; }
  saveNow();
  activeId = id;
  const n = activeNote();
  if (!n) return;
  titleEl.value = n.title;
  renderEditor(n.body);
  undoStack = []; redoStack = [];
  renderList();
  fitCanvas();
  syncTools();
  updateCounts();
  renderPasteChip();
  closeDrawer();
  if (opts.focus) bodyEl.focus();
}

titleEl.addEventListener("input", () => {
  const n = activeNote(); if (!n) return;
  n.title = titleEl.value; touch(n); scheduleSave(); scheduleList();
});
/* one commit path for every change to the note text */
function commitEditor() {
  const n = activeNote(); if (!n) return;
  n.body = serializeEditor();
  syncImagesFromDom(n);
  touch(n); scheduleSave(); scheduleList(); updateCounts();
}
bodyEl.addEventListener("input", commitEditor);

/* paste text as plain text — never let rich HTML from another app land in the note */
function pastePlain(text) {
  const lines = String(text).replace(/\r/g, "").split("\n");
  let inCode = false;
  const drops = [];
  for (let i = 0; i < lines.length; i++) {
    if (i > 0) {
      document.execCommand("insertParagraph");
      /* a split block copies its type — every pasted line starts clean */
      const nb = blockOfCaret();
      if (nb) setBlockType(nb, inCode ? "code" : "p");
    }
    const line = lines[i];
    if (/^```/.test(line)) {
      /* a fence is a marker, not a line of the note */
      const b = blockOfCaret();
      if (b && !b.textContent.trim()) drops.push(b);
      inCode = !inCode;
      continue;
    }
    document.execCommand("insertText", false, line);
    const b = blockOfCaret();
    if (!b) continue;
    if (inCode) setBlockType(b, "code"); else normalizeBlock(b);
  }
  for (const d of drops) if (d.isConnected && blocksOf().length > 1) d.remove();
  commitEditor();
}
bodyEl.addEventListener("paste", (e) => {
  if (clipboardImage(e)) return;
  const dt = e.clipboardData;
  const text = dt ? dt.getData("text/plain") : "";
  if (text === "" && !(dt && dt.types && dt.types.length)) return;
  e.preventDefault();
  pastePlain(text);
});

/* click an image to look at it — a drag-select across it should not open the viewer */
bodyEl.addEventListener("click", (e) => {
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;          /* a drag-select is not a click */
  const t = e.target;
  if (t && t.tagName === "A" && t.getAttribute("href")) {
    e.preventDefault();
    window.open(t.getAttribute("href"), "_blank", "noopener,noreferrer");
    return;
  }
  if (t && t.tagName === "IMG" && t.dataset.img) openLightbox(t.src);
});
bodyEl.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    document.execCommand("insertText", false, "  ");
  }
});

function updateCounts() {
  const body = serializeEditor();
  const text = blocksOf().map(el => el.textContent).join("\n").trim();
  const words = text ? text.split(/\s+/).length : 0;
  countsEl.textContent = `${words} ${words === 1 ? "word" : "words"} · ${body.length} chars`;
  emptyHint.hidden = !!(text || bodyEl.querySelector("img"));
}

/* ---------- canvas ---------- */
function fitCanvas() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}

function paintStroke(s, fromIndex = 0) {
  const pts = s.p;
  if (!pts || !pts.length) return;
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = s.c;
  if (s.e) ctx.globalCompositeOperation = "destination-out";
  if (pts.length === 1) {
    const p = pts[0];
    ctx.beginPath();
    ctx.arc(p[0] * W, p[1] * H, Math.max(0.6, s.w * (0.4 + 0.7 * p[2]) / 2) * (s.e ? 2.4 : 1), 0, Math.PI * 2);
    ctx.fillStyle = s.e ? "#000" : s.c;
    ctx.fill();
    ctx.restore();
    return;
  }
  for (let i = Math.max(1, fromIndex); i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    ctx.beginPath();
    ctx.lineWidth = Math.max(0.4, s.w * (0.35 + 0.75 * ((a[2] + b[2]) / 2))) * (s.e ? 2.6 : 1);
    ctx.moveTo(a[0] * W, a[1] * H);
    ctx.lineTo(b[0] * W, b[1] * H);
    ctx.stroke();
  }
  ctx.restore();
}

function redraw() {
  ctx.clearRect(0, 0, W, H);
  const n = activeNote();
  if (!n) return;
  paintImages(ctx, W, H);
  for (const s of n.strokes) paintStroke(s);
  hintEl.style.opacity = (n.strokes.length || (n.pasted && n.pasted.length)) ? "0" : "1";
}

function pointFromEvent(e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / (r.width || 1);
  const y = (e.clientY - r.top) / (r.height || 1);
  const pr = e.pointerType === "pen" ? Math.max(0.05, e.pressure || 0.5) : 0.5;
  return [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y)), pr];
}

const snapshot = (arr) => arr.map(s => ({ c: s.c, w: s.w, e: !!s.e, p: s.p.slice() }));
const clonePasted = (list) => (list || []).map(L => ({ id: L.id, src: L.src, x: L.x, y: L.y, w: L.w, h: L.h, on: L.on !== false }));

/* a history entry is the whole drawable state, so paste/undo behave like strokes */
function stateSnapshot() {
  const n = activeNote(); if (!n) return null;
  return { strokes: snapshot(n.strokes), pasted: clonePasted(n.pasted) };
}
function restoreState(st) {
  const n = activeNote(); if (!n || !st) return;
  n.strokes = st.strokes || [];
  n.pasted = st.pasted || [];
  touch(n); redraw(); scheduleSave(); scheduleList(); syncTools(); renderPasteChip();
}
function pushUndo() {
  const st = stateSnapshot(); if (!st) return;
  undoStack.push(st);
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
}

cv.addEventListener("pointerdown", (e) => {
  if (!activeNote()) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* synthetic or stale pointer */ }
  drawing = true;
  stroke = { c: color, w: brush, e: erasing, p: [pointFromEvent(e)] };
  paintStroke(stroke);
  hintEl.style.opacity = "0";
});

cv.addEventListener("pointermove", (e) => {
  if (!drawing || !stroke) return;
  let events = [];
  if (e.getCoalescedEvents) { try { events = e.getCoalescedEvents(); } catch (_) {} }
  if (!events || !events.length) events = [e];
  const start = stroke.p.length;
  for (const ev of events) {
    const p = pointFromEvent(ev);
    const last = stroke.p[stroke.p.length - 1];
    if (!last || Math.hypot(p[0] - last[0], p[1] - last[1]) > 0.0006) stroke.p.push(p);
  }
  if (stroke.p.length > start) paintStroke(stroke, Math.max(1, start));
});

function endStroke() {
  if (!drawing) return;
  drawing = false;
  const n = activeNote();
  if (n && stroke && stroke.p.length) {
    pushUndo();
    n.strokes.push(stroke);
    touch(n); scheduleSave(); scheduleList(); syncTools();
  }
  stroke = null;
}
cv.addEventListener("pointerup", endStroke);
cv.addEventListener("pointercancel", endStroke);
cv.addEventListener("pointerleave", endStroke);

function buildSwatches() {
  const wrap = $("swatches");
  COLORS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "sw" + (i === 0 ? " on" : "");
    b.style.background = c;
    b.dataset.c = c;
    b.title = "Ink " + (i + 1);
    b.addEventListener("click", () => {
      color = c; erasing = false;
      document.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === b));
      syncTools();
    });
    wrap.appendChild(b);
  });
}

function syncTools() {
  $("penBtn").setAttribute("aria-pressed", String(!erasing));
  $("eraserBtn").setAttribute("aria-pressed", String(erasing));
  const u = $("undoBtn"), r = $("redoBtn");
  u.disabled = !undoStack.length; r.disabled = !redoStack.length;
  u.style.opacity = undoStack.length ? "" : ".35";
  r.style.opacity = redoStack.length ? "" : ".35";
  cv.style.cursor = erasing ? "cell" : "crosshair";
}

$("penBtn").addEventListener("click", () => { erasing = false; syncTools(); });
$("eraserBtn").addEventListener("click", () => { erasing = true; syncTools(); });
$("size").addEventListener("input", (e) => { brush = parseFloat(e.target.value) || 2.4; });

function undo() {
  const n = activeNote(); if (!n || !undoStack.length) return;
  const st = stateSnapshot(); if (!st) return;
  redoStack.push(st);
  restoreState(undoStack.pop());
}
function redo() {
  const n = activeNote(); if (!n || !redoStack.length) return;
  const st = stateSnapshot(); if (!st) return;
  undoStack.push(st);
  restoreState(redoStack.pop());
}
$("undoBtn").addEventListener("click", undo);
$("redoBtn").addEventListener("click", redo);

$("pngBtn").addEventListener("click", () => {
  const n = activeNote(); if (!n) return;
  if (!n.strokes.length && !(n.pasted && n.pasted.length)) { toast("Nothing drawn yet."); return; }
  const scale = 2;
  const out = document.createElement("canvas");
  out.width = Math.round(W * scale); out.height = Math.round(H * scale);
  const o = out.getContext("2d");
  const paper = getComputedStyle(document.documentElement).getPropertyValue("--paper").trim() || "#fff";
  o.fillStyle = paper || "#fff";
  o.fillRect(0, 0, out.width, out.height);
  o.scale(scale, scale);
  paintImages(o, W, H);
  for (const s of n.strokes) {
    o.save();
    o.lineCap = "round"; o.lineJoin = "round"; o.strokeStyle = s.c;
    if (s.e) o.globalCompositeOperation = "destination-out";
    for (let i = 1; i < s.p.length; i++) {
      const a = s.p[i - 1], b = s.p[i];
      o.beginPath();
      o.lineWidth = Math.max(0.4, s.w * (0.35 + 0.75 * ((a[2] + b[2]) / 2))) * (s.e ? 2.6 : 1);
      o.moveTo(a[0] * W, a[1] * H);
      o.lineTo(b[0] * W, b[1] * H);
      o.stroke();
    }
    o.restore();
  }
  out.toBlob((blob) => {
    if (!blob) { toast("Couldn't export the drawing."); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = ((n.title.trim() || "sketch").replace(/[^\w \-]+/g, "") || "sketch") + ".png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Drawing saved as PNG.");
  }, "image/png");
});

if (window.ResizeObserver) {
  new ResizeObserver(() => {
    const r = cv.getBoundingClientRect();
    if (Math.abs(r.width - W) > 0.5 || Math.abs(r.height - H) > 0.5) fitCanvas();
  }).observe(cv);
}
window.addEventListener("resize", fitCanvas);


/* ---------- pasted images ---------- */
const tokenFor = (id) => "![image](slateimg:" + id + ")";
const numOr = (v, d) => (typeof v === "number" && isFinite(v)) ? v : d;

function cleanImages(list) {
  if (!Array.isArray(list)) return [];
  const out = [];
  for (const i of list) {
    if (!i || typeof i.src !== "string" || i.src.indexOf("data:image/") !== 0) continue;
    out.push({ id: typeof i.id === "string" && i.id ? i.id : uid(), src: i.src });
  }
  return out;
}
function cleanPasted(list) {
  if (!Array.isArray(list)) return [];
  const out = [];
  for (const L of list) {
    if (!L || typeof L.src !== "string" || L.src.indexOf("data:image/") !== 0) continue;
    out.push({
      id: typeof L.id === "string" && L.id ? L.id : uid(), src: L.src,
      x: numOr(L.x, .08), y: numOr(L.y, .08), w: numOr(L.w, .84), h: numOr(L.h, .84),
      on: L.on !== false
    });
  }
  return out;
}

function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add("show"); }
function closeLightbox() { lightbox.classList.remove("show"); lightboxImg.removeAttribute("src"); }
lightbox.addEventListener("click", closeLightbox);

/* clipboard images are re-encoded smaller: localStorage holds about 5 MB per origin */
let _webp = null;
function canWebp() {
  if (_webp !== null) return _webp;
  try {
    const c = document.createElement("canvas"); c.width = 1; c.height = 1;
    _webp = c.toDataURL("image/webp").indexOf("data:image/webp") === 0;
  } catch (_) { _webp = false; }
  return _webp;
}
function decodeViaImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };

  if (!target) return;

  e.preventDefault();
  if (target === "note") attachToNote(file); else pasteIntoCanvas(file);
}, true);

/* dropping a file works like pasting one */
document.addEventListener("drop", (e) => {
  const dt = e.dataTransfer;
  let file = null;
  if (dt) {
    for (const f of Array.from(dt.files || [])) if (f.type && f.type.indexOf("image/") === 0) { file = f; break; }
    if (!file) for (const it of Array.from(dt.items || [])) {
      if (it.kind === "file" && it.type.indexOf("image/") === 0) { file = it.getAsFile(); break; }
    }
  }
  if (!file) return;
  e.preventDefault();
  const t = e.target;
  if (t && (t === bodyEl || bodyEl.contains(t))) {
    let r = null;
    try { r = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null; } catch (_) {}
    if (r) {
      const sel = window.getSelection();
      if (sel) { sel.removeAllRanges(); sel.addRange(r); }
    }
    attachToNote(file);
  } else if (t && t.closest && t.closest(".canvas-pane")) {
    pasteIntoCanvas(file);
  } else if (document.querySelector(".canvas-pane").getBoundingClientRect().width === 0) {
    attachToNote(file);
  }
}, true);

/* an image is atomic, so chrome will not delete it on its own — do it for it */
function adjacentImg(dir) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  const node = r.startContainer, off = r.startOffset;
  const isImg = (n) => !!(n && n.nodeType === 1 && n.tagName === "IMG" && n.dataset.img);
  if (node.nodeType === 3) {
    if (dir === "back" && off === 0) {
      let p = node.previousSibling;
      while (p && p.nodeType === 1 && p.tagName === "SPAN" && !p.textContent) p = p.previousSibling;
      return isImg(p) ? p : null;
    }
    if (dir === "fwd" && off === node.length) {
      let n = node.nextSibling;
      while (n && n.nodeType === 1 && n.tagName === "SPAN" && !n.textContent) n = n.nextSibling;
      return isImg(n) ? n : null;
    }
    return null;
  }
  if (node.nodeType === 1) {
    const ch = node.childNodes[dir === "back" ? off - 1 : off];
    return isImg(ch) ? ch : null;
  }
  return null;
}
bodyEl.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod) {
    const code = e.code;
    let type = null;
    if (code === "Digit1") type = "h1";
    else if (code === "Digit2") type = "h2";
    else if (code === "Digit3") type = "h3";
    else if (code === "Backquote") type = "code";
    else if (e.shiftKey && code === "Digit8") type = "ul";
    else if (e.shiftKey && code === "Digit7") type = "ol";
    if (type) {
      e.preventDefault();
      formatSelection(type);
      toast(type.toUpperCase() + " block");
      return;
    }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const b = blockOfCaret();
    if (!b) return;
    const t = blockType(b);
    const empty = !b.textContent.trim() && !b.querySelector("img");
    if (empty && (t === "ul" || t === "ol" || t === "code")) {
      e.preventDefault();
      setBlockType(b, "p");
      commitEditor();
      return;
    }
    e.preventDefault();
    document.execCommand("insertParagraph");
    const nb = blockOfCaret();
    if (nb) setBlockType(nb, (t === "ul" || t === "ol" || t === "code") ? t : "p");
    commitEditor();
    return;
  }
  if (e.key === "Backspace") {
    const b = blockOfCaret();
    const t = b ? blockType(b) : "p";
    if (b && t !== "p" && t !== "code" && caretOffset(b) === 0) {
      e.preventDefault();                        /* step out of the block type first */
      setBlockType(b, "p");
      commitEditor();
      return;
    }
  }
  if (e.key !== "Backspace" && e.key !== "Delete") return;
  const im = adjacentImg(e.key === "Backspace" ? "back" : "fwd");
  if (!im) return;
  e.preventDefault();
  /* select it and let the editor delete it, so ⌘Z can bring it back */
  const sel = window.getSelection();
  if (!sel) return;
  const r = document.createRange();
  r.selectNode(im);
  sel.removeAllRanges();
  sel.addRange(r);
  let ok = false;
  try { ok = document.execCommand("delete"); } catch (_) { ok = false; }
  if (!ok && im.parentNode) im.remove();
  commitEditor();
});

/* clicking the canvas gives it focus, so ⌘V afterwards means "paste onto the drawing" */
cv.addEventListener("pointerdown", () => {
  try { cv.focus({ preventScroll: true }); } catch (_) { try { cv.focus(); } catch (__) {} }
}, true);

$("chipThumb").addEventListener("click", () => {
  const n = activeNote();
  if (n && n.pasted && n.pasted.length) openLightbox(n.pasted[n.pasted.length - 1].src);
});
$("chipEye").addEventListener("click", () => {
  const n = activeNote();
  if (!n || !n.pasted || !n.pasted.length) return;
  const hide = n.pasted.some(L => L.on !== false);
  n.pasted.forEach(L => { L.on = !hide; });
  touch(n); redraw(); scheduleSave(); renderPasteChip();
});
$("chipX").addEventListener("click", () => {
  const n = activeNote();
  if (!n || !n.pasted || !n.pasted.length) return;
  pushUndo();
  n.pasted = [];
  touch(n); redraw(); scheduleSave(); scheduleList(); syncTools(); renderPasteChip();
  toast("Pasted image removed — ⌘Z brings it back");
});

/* ---------- actions ---------- */
function newNote() {
  saveNow();
  const n = blankNote();
  notes.unshift(n);
  activeId = n.id;
  titleEl.value = ""; renderEditor("");
  undoStack = []; redoStack = [];
  renderList(); fitCanvas(); syncTools(); updateCounts(); renderPasteChip();
  closeDrawer();
  titleEl.focus();
  scheduleSave();
  toast("New note");
}
$("newBtn").addEventListener("click", newNote);

$("deleteBtn").addEventListener("click", () => {
  const n = activeNote(); if (!n) return;
  const label = n.title.trim() || "this note";
  if (!confirm(`Delete “${label}”? This can't be undone.`)) return;
  notes = notes.filter(x => x.id !== n.id);
  if (!notes.length) notes = [blankNote()];
  notes.sort((a, b) => b.updated - a.updated);
  activeId = notes[0].id;
  persist();
  selectNote(activeId, { force: true });
  toast("Note deleted");
});

searchEl.addEventListener("input", renderList);
searchEl.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { searchEl.value = ""; renderList(); bodyEl.focus(); }
  if (e.key === "Enter") { const first = notesEl.querySelector(".note-item"); if (first) first.click(); }
});

/* ---------- import / export ---------- */
function download(name, text, type = "application/json") {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$("exportAllBtn").addEventListener("click", () => {
  saveNow();
  const stamp = new Date().toISOString().slice(0, 10);
  download(`slate-${stamp}.json`, JSON.stringify({ app: "slate", version: 1, notes }, null, 2));
  toast(`Exported ${notes.length} note${notes.length === 1 ? "" : "s"}`);
});

$("importBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = Array.isArray(data) ? data : data.notes;
    if (!Array.isArray(incoming)) throw new Error("no notes");
    let added = 0;
    for (const n of incoming) {
      if (!n || typeof n !== "object") continue;
      notes.unshift({
        id: uid(), title: String(n.title || ""), body: String(n.body || ""),
        strokes: Array.isArray(n.strokes) ? n.strokes : [],
        images: cleanImages(n.images), pasted: cleanPasted(n.pasted),
        created: n.created || now(), updated: n.updated || now()
      });
      added++;
    }
    persist(); renderList();
    if (added) selectNote(notes[0].id, { force: true });
    toast(`Imported ${added} note${added === 1 ? "" : "s"}`);
  } catch (err) {
    toast("That file isn't a Slate export.");
  } finally {
    e.target.value = "";
  }
});

/* ---------- share ---------- */
function b64url(bytes) {
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(str) {
  const s = str.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "=".repeat((4 - (s.length % 4)) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function packNote(n) {
  const payload = JSON.stringify({ t: n.title, b: n.body, s: n.strokes, i: cleanImages(n.images), p: cleanPasted(n.pasted) });
  if (!("CompressionStream" in window)) return "raw." + b64url(new TextEncoder().encode(payload));
  const stream = new Blob([payload]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  return "z." + b64url(buf);
}
async function unpackNote(token) {
  // "z." is 2 chars, "raw." is 4 — stripping a fixed 4 corrupted every compressed link
  const isRaw = token.startsWith("raw.");
  const bytes = unb64url(isRaw ? token.slice(4) : token.slice(2));
  let text;
  if (isRaw) {
    text = new TextDecoder().decode(bytes);
  } else {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    text = await new Response(stream).text();
  }
  const d = JSON.parse(text);
  return {
    title: String(d.t || ""), body: String(d.b || ""),
    strokes: Array.isArray(d.s) ? d.s : [],
    images: cleanImages(d.i), pasted: cleanPasted(d.p)
  };
}

$("shareBtn").addEventListener("click", async () => {
  const n = activeNote(); if (!n) return;
  saveNow();
  try {
    const token = await packNote(n);
    const base = (location.origin && location.origin !== "null")
      ? location.origin + location.pathname
      : location.href.split("#")[0];
    const url = base + "#n=" + token;
    if (url.length > 60000) { toast("Too big for a link — use Export all instead."); return; }
    await navigator.clipboard.writeText(url);
    toast(`Link copied (${Math.round(url.length / 1024)} KB) — it carries the whole note`);
  } catch (e) {
    toast("Couldn't copy the link. Try Export all instead.");
  }
});

async function importFromHash() {
  const h = location.hash || "";
  if (!h.startsWith("#n=")) return;
  try {
    const d = await unpackNote(h.slice(3));
    const n = blankNote({ title: d.title, body: d.body, strokes: d.strokes, images: d.images, pasted: d.pasted });
    notes.unshift(n);
    activeId = n.id;
    persist();
    history.replaceState(null, "", location.pathname + location.search);
    titleEl.value = n.title; renderEditor(n.body);
    toast("Note imported from link");
  } catch (e) {
    toast("That link couldn't be read.");
  }
}

/* ---------- phones: keep the app inside what you can actually see ---------- */
const rootEl = document.documentElement;
let vvFrame = 0;
function syncViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const h = Math.round(vv.height);
  /* iOS leaves the layout viewport at full height when the keyboard opens and
     shrinks only the visual one — mirror it, or the caret hides behind the keys */
  const keyboard = h > 0 && h < window.innerHeight - 120;
  rootEl.classList.toggle("kb-open", keyboard);
  if (keyboard) rootEl.style.setProperty("--app-h", h + "px");
  else rootEl.style.removeProperty("--app-h");
}
if (window.visualViewport) {
  const onViewportChange = () => { cancelAnimationFrame(vvFrame); vvFrame = requestAnimationFrame(syncViewport); };
  window.visualViewport.addEventListener("resize", onViewportChange);
  window.visualViewport.addEventListener("scroll", onViewportChange);
  syncViewport();
}
window.addEventListener("orientationchange", () => setTimeout(() => { syncViewport(); fitCanvas(); }, 220));

/* the canvas hint should speak the language of the device you are on */
const coarsePtr = window.matchMedia ? window.matchMedia("(pointer: coarse)") : null;
function syncHintText() {
  const touch = !!(coarsePtr && coarsePtr.matches);
  hintEl.textContent = touch
    ? "Draw with a finger or a stylus"
    : "Draw with a mouse, finger, or pen · ⌘V pastes an image";
}
if (coarsePtr && coarsePtr.addEventListener) coarsePtr.addEventListener("change", syncHintText);
syncHintText();

/* ---------- theme / mode / drawer ---------- */
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem(LS_THEME, t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "dark" ? "#141310" : "#f7f5f1");
}
$("themeBtn").addEventListener("click", () => {
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});

function applyMode(m) {
  const effective = (m === "split" && window.innerWidth <= 940) ? "write" : m;
  app.setAttribute("data-mode", effective);
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.mode === effective));
  const tg = $("modeToggle");
  if (tg) {
    const drawing = effective === "draw";
    tg.textContent = drawing ? "¶" : "✎";
    tg.title = drawing ? "Back to writing" : "Draw";
    tg.setAttribute("aria-label", tg.title);
  }
  localStorage.setItem(LS_MODE, m);
  requestAnimationFrame(fitCanvas);
}
/* phones get one button instead of Write/Split/Draw */
$("modeToggle").addEventListener("click", () => {
  applyMode(app.getAttribute("data-mode") === "draw" ? "write" : "draw");
});
$("modeSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-mode]");
  if (b) applyMode(b.dataset.mode);
});

function openDrawer() { sidebar.classList.add("open"); backdrop.classList.add("show"); }
function closeDrawer() { sidebar.classList.remove("open"); backdrop.classList.remove("show"); }
$("menuBtn").addEventListener("click", openDrawer);
backdrop.addEventListener("click", closeDrawer);

/* ---------- keyboard ---------- */
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  const k = e.key.toLowerCase();
  if (mod && k === "n") { e.preventDefault(); newNote(); }
  else if (mod && k === "k") { e.preventDefault(); searchEl.focus(); searchEl.select(); }
  else if (mod && k === "s") { e.preventDefault(); saveNow(); toast("Saved"); }
  else if (mod && k === "z" && document.activeElement !== bodyEl && document.activeElement !== titleEl) {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
  else if (e.key === "Escape") {
    if (lightbox.classList.contains("show")) { closeLightbox(); return; }
    if (sidebar.classList.contains("open")) closeDrawer();
    else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
});

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}

/* ---------- install, offline, service worker ---------- */
const isStandalone = () =>
  (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
  (window.matchMedia && matchMedia("(display-mode: fullscreen)").matches) ||
  window.navigator.standalone === true;

let installEvent = null;
const installBtn = $("installBtn"), installHint = $("installHint");

function refreshInstallUI() {
  const already = isStandalone();
  installBtn.hidden = already || !installEvent;
  /* Safari never fires beforeinstallprompt, so offer the manual route there */
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  installHint.hidden = already || !!installEvent || !ios;
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installEvent = e;
  refreshInstallUI();
});
window.addEventListener("appinstalled", () => {
  installEvent = null;
  refreshInstallUI();
  toast("Installed — Slate is on your home screen");
});
installBtn.addEventListener("click", async () => {
  if (!installEvent) return;
  try {
    installEvent.prompt();
    await installEvent.userChoice;
  } catch (_) {}
  installEvent = null;
  refreshInstallUI();
});

function syncNet() {
  const n = $("net");
  if (n) n.hidden = navigator.onLine !== false;
}
window.addEventListener("online", syncNet);
window.addEventListener("offline", syncNet);
syncNet();

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    /* only nag when an update replaced a version this page already ran */
    if (hadController) toast("Updated in the background — reopen Slate to see it");
    hadController = true;
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
  });
}

/* site data can be evicted when the device runs low — ask to be kept */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* launcher shortcuts from the installed app: ?action=new|draw|search */
function handleLaunchAction() {
  let params;
  try { params = new URLSearchParams(location.search); } catch (_) { return; }
  const act = params.get("action");
  if (act === "new") newNote();
  else if (act === "draw") applyMode("draw");
  else if (act === "search") { openDrawer(); setTimeout(() => searchEl.focus(), 80); }
  if (act || params.has("source")) history.replaceState(null, "", location.pathname + location.hash);
}

/* ---------- boot ---------- */
load();
applyTheme(localStorage.getItem(LS_THEME) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
buildSwatches();
applyMode(localStorage.getItem(LS_MODE) || (window.innerWidth <= 940 ? "write" : "split"));
titleEl.value = activeNote().title;
renderEditor(activeNote().body);
renderList();
updateCounts();
renderPasteChip();
requestAnimationFrame(() => { fitCanvas(); syncTools(); });
importFromHash().finally(() => {
  renderList(); renderPasteChip(); fitCanvas();
  handleLaunchAction();
  refreshInstallUI();
});
window.addEventListener("beforeunload", saveNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });
})();
</script>
</body>
</html>
